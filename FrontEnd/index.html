<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDqq3UNtiWz-LexLzTgqvrHfIJCmPpO_JI&callback=initMap" async defer></script>
      <script>
            function initMap() {
            // Define the location coordinates
            const location = { lat: 22.576091388745656, lng: 88.42849922793046 };

            // Ensure the Google Maps API is available
            if (typeof google === "undefined" || !google.maps) {
                console.error("Google Maps API failed to load.");
                return;
            }

            // Create the map centered at the specified location
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 12,
                center: location,
            });

            // Add a marker at the specified location
            new google.maps.Marker({
                position: location,
                map: map,
                title: "We are here!",
            });
        }
      </script>
      <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
